[package]
name = "steg-core"
version = "1.0.0"
edition = "2021"
description = "Client-side steganography core for masc: LSB bit embedding into RGBA images and trailing-file appending. Exposed to JavaScript via WASM."
license = "MIT"
repository = "https://github.com/your-org/masc"
readme = "README.md"

[lib]
# cdylib -> .wasm for the browser, rlib -> so `cargo test` works natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Crypto", "Window"] }
crc32fast = "1"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[dev-dependencies]
# Deterministic RNG for the native unit tests (no OS CSPRNG needed).
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
