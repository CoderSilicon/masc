name: Feature request
description: Suggest a focused improvement to masc
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        masc is deliberately small. Features that add a backend, telemetry, accounts, or
        cloud storage are unlikely to be accepted. Please describe the problem before the
        solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need, not just the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should masc behave? Include UI, format, or security implications.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Picture / Method A
        - File / Method B
        - Encryption
        - Carving / recovery
        - UI / accessibility
        - Performance
        - Documentation
        - Build / tooling
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Would this change the container format?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I understand that masc is proprietary, that the PolyForm Strict license is for noncommercial use only, and that contributions require prior written permission and agreement to CONTRIBUTING.md.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
